name: Git auth for the private @etqan/tokens
description: >-
  Rewrites every GitHub URL form to an authenticated HTTPS one, so pnpm can
  install the private tokens package and git can fetch its tags.
inputs:
  token:
    description: A token that can read the tokens repository
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        for from in "https://github.com/" "git@github.com:" "ssh://git@github.com/"; do
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "$from"
        done

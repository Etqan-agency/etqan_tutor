name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_DB: etqan_test, POSTGRES_USER: etqan, POSTGRES_PASSWORD: etqan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etqan" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://etqan:etqan@localhost:5432/etqan_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/local.txt
      - run: ruff check . && ruff format --check .
      - run: lint-imports
      - run: pytest --create-db --cov=etqan -q

  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - name: Configure git auth for private @etqan/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Fetch tokens submodule tags
        working-directory: .
        run: git -C tokens fetch --depth=1 --force origin "+refs/tags/*:refs/tags/*"
      - name: Token pin agrees with the submodule (G3)
        working-directory: .
        run: node scripts/check-token-pin.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  marketing:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: marketing } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: marketing/pnpm-lock.yaml }
      - name: Configure git auth for private @etqan/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Fetch tokens submodule tags
        working-directory: .
        run: git -C tokens fetch --depth=1 --force origin "+refs/tags/*:refs/tags/*"
      - name: Token pin agrees with the submodule (G3)
        working-directory: .
        run: node scripts/check-token-pin.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - name: Validate the local and e2e Caddyfiles
        run: |
          for f in caddy/Caddyfile.local caddy/Caddyfile.e2e; do
            docker run --rm -v "$PWD/$f:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile || exit 1
          done
      # The production image bakes in infra/caddy/Caddyfile and the cloudflare DNS
      # module. The token only has to be well-formed (40 chars) to provision.
      # TLS_MODE unset is production (cloudflare); internal is staging's.
      - name: Validate the production Caddyfile (infra) in both TLS modes
        run: |
          docker build -t etqan-edge infra/caddy
          edge() {
            docker run --rm -e BASE_DOMAIN=example.com -e ACME_EMAIL=ci@example.com \
              -e CF_API_TOKEN=0000000000000000000000000000000000000000 "$@"
          }
          validate=(caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile)
          adapt=(caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile)
          edge etqan-edge "${validate[@]}"
          edge -e TLS_MODE=internal etqan-edge "${validate[@]}"
          edge -e TLS_MODE=internal etqan-edge "${adapt[@]}" | grep -q '"module":"internal"'
          # Unset means cloudflare: the same config, byte for byte.
          diff <(edge etqan-edge "${adapt[@]}") <(edge -e TLS_MODE=cloudflare etqan-edge "${adapt[@]}")
          # Any other value names no snippet, and the edge refuses to start.
          if edge -e TLS_MODE=internl etqan-edge "${validate[@]}"; then
            echo "TLS_MODE=internl was accepted"; exit 1
          fi

  infra-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - name: shellcheck the deploy, smoke, simulation and helper scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            infra/scripts/*.sh infra/scripts/tests/*.sh infra/scripts/tests/fakebin/* \
            infra/staging-sim/entrypoint.sh scripts/deploy-staging.sh scripts/staging-sim.sh \
            scripts/staging-sim-needed.sh
      - name: ship.sh, smoke.sh and compose tests
        run: |
          bash infra/scripts/tests/ship_test.sh
          bash infra/scripts/tests/smoke_test.sh
          bash infra/scripts/tests/compose_test.sh
          bash infra/scripts/tests/edge_ca_test.sh

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_DB: etqan, POSTGRES_USER: etqan, POSTGRES_PASSWORD: etqan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etqan" --health-interval 5s --health-timeout 3s --health-retries 10
      # The cache is Redis in local settings; allauth's login rate limiting uses it.
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://etqan:etqan@localhost:5432/etqan
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only
      # Invites are real emails the e2e suite reads back: send them inline (no
      # worker) into files that e2e/mail.ts parses via E2E_MAIL_DIR.
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      DJANGO_EMAIL_FILE_PATH: /tmp/etqan-mail
      CELERY_TASK_ALWAYS_EAGER: "true"
      DJANGO_TENANT_URL_TEMPLATE: http://{domain}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: "dashboard/pnpm-lock.yaml\nmarketing/pnpm-lock.yaml" }
      - name: Configure git auth for private @etqan/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Backend up with seeded academies
        working-directory: backend
        run: |
          pip install -r requirements/local.txt
          python manage.py migrate_schemas --shared
          mkdir -p /tmp/etqan-mail
          python manage.py seed_dev
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf -H "Host: etqan.localhost" http://127.0.0.1:8000/health/live/ && break; sleep 1; done
          curl -sf -H "Host: etqan.localhost" http://127.0.0.1:8000/health/live/ >/dev/null || { echo "backend did not start"; cat /tmp/django.log; exit 1; }
      - name: Dashboard preview (base /app/)
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/app/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/app/ >/dev/null || { echo "dashboard preview did not start"; cat /tmp/preview.log; exit 1; }
      - name: Marketing site
        working-directory: marketing
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          SITE_API_ORIGIN=http://127.0.0.1:8000 SITE_SCHEME=http HOST=127.0.0.1 PORT=4321 \
            nohup node dist/server/entry.mjs > /tmp/marketing.log 2>&1 &
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:4321/ || { echo "marketing did not start"; cat /tmp/marketing.log; exit 1; }
      - name: Caddy edge on :80
        run: |
          docker run -d --name edge --network host \
            -v "$PWD/caddy/Caddyfile.e2e:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine
          for _ in $(seq 1 30); do curl -sf http://demo.etqan.localhost/api/v1/site/branding/ >/dev/null && break; sleep 1; done
          curl -sf http://demo.etqan.localhost/api/v1/site/branding/ >/dev/null || { echo "edge did not come up"; docker logs edge; exit 1; }
      - name: Playwright
        working-directory: dashboard
        env:
          E2E_DEMO_URL: http://demo.etqan.localhost
          E2E_OTHER_URL: http://other.etqan.localhost
          E2E_MAIL_DIR: /tmp/etqan-mail
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - if: failure()
        run: |
          tail -n 200 /tmp/django.log /tmp/preview.log /tmp/marketing.log
          docker logs edge 2>&1 | tail -n 100

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      # Pinned image: an unpinned scanner changes what "green" means without a
      # commit. Known historical findings are allowlisted by fingerprint in
      # .gitleaksignore, so a NEW secret in a NEW commit still fails here.
      - name: Gitleaks — meta repo history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
      # Directory mode covers the submodule working trees, which the history
      # scan above cannot see (submodule histories are a known gap).
      - name: Gitleaks — checked-out tree, submodules included
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner --exit-code 1

  # Spec §3.1: every image, built after the tests pass. Pull requests build
  # only (a broken Dockerfile fails the PR); master pushes <meta-sha> and
  # :master to GHCR (private). The backend image needs no build arguments
  # (its default target is production); the frontends read the private
  # @etqan/tokens repo through the tokens_token build secret.
  images:
    needs: [backend, dashboard, marketing, caddy, e2e, infra-scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, dashboard, marketing]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.name }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/etqan-agency/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/etqan-agency/${{ matrix.name }}:master
          # Links the package to this repository, so this workflow may push it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          secrets: tokens_token=${{ secrets.TOKENS_REPO_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Spec §5: which pull requests need the staging simulation.
  sim-needed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "run=$(bash scripts/staging-sim-needed.sh "$BASE")" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Spec §5: the staging deploy against a simulated server (sshd and
  # Docker-in-Docker, privileged, started with docker run: a service
  # container cannot be built from this repo). Two blue/green deploys under
  # a health poll, the smoke check, seed_staging and the full journey. One
  # retry of the whole run, never of a step.
  staging-sim:
    needs: [sim-needed, images]
    if: needs.sim-needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIM_SHA: ${{ github.sha }}
      SIM_DIR: ${{ github.workspace }}/../staging-sim
    steps:
      # The server pulls about 3 GB, and ship.sh refuses to start with less
      # than 5 GB free: drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - name: Configure git auth for private @etqan/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Playwright (the journey runs from here)
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Simulated server and registry up
        run: bash scripts/staging-sim.sh up
      - uses: docker/setup-buildx-action@v4
      # The images job's layer cache makes these rebuilds cheap; they load
      # into the runner's docker, tagged for the local registry.
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: localhost:15000/etqan-agency/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          load: true
          tags: localhost:15000/etqan-agency/dashboard:${{ github.sha }}
          secrets: tokens_token=${{ secrets.TOKENS_REPO_TOKEN }}
          cache-from: type=gha,scope=dashboard
      - uses: docker/build-push-action@v7
        with:
          context: marketing
          load: true
          tags: localhost:15000/etqan-agency/marketing:${{ github.sha }}
          secrets: tokens_token=${{ secrets.TOKENS_REPO_TOKEN }}
          cache-from: type=gha,scope=marketing
      - name: Deploy twice, seed, smoke and walk the journey
        run: |
          bash scripts/staging-sim.sh run && exit 0
          echo "::warning::The staging simulation failed; retrying the whole run once."
          bash scripts/staging-sim.sh down
          bash scripts/staging-sim.sh up
          bash scripts/staging-sim.sh run
      - if: failure()
        name: Server logs
        run: |
          docker exec etqan-sim-server sh -c 'cd /opt/etqan && docker compose -f docker-compose.production.yml \
            -f docker-compose.staging.yml --env-file .env.production logs --no-color --tail 150' || true
      - if: always()
        run: bash scripts/staging-sim.sh down

  # Spec §3.2: every green master is deployed to staging, once a server
  # exists; without the STAGING_SSH_HOST secret the job skips its steps and
  # succeeds. Manual runs (rollback) use the same workflow.
  deploy-staging:
    needs: [images, staging-sim]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-staging.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit

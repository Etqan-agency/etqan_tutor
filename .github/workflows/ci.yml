name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

# Every job carries a timeout of about 3x its measured wall clock: GitHub's
# default is 6 hours, and a hung job would hold the deploy that long.
#
# PostgreSQL is pinned to 18.6 here, in docker-compose.local.yml and in
# infra's production compose: on 18.7 django-tenants' clone_schema spins and
# creating an academy never returns. Move all three together.

jobs:
  # Runs first, on every event. `gates` is false when the change cannot break
  # the code (every path under docs/ or a root *.md) or when a green pull
  # request already tested this exact tree (`verified`, push only). The gate
  # jobs skip on false; docs-site and security skip only on `verified`, since
  # docs-site builds docs/ and a secret scan reads every byte (ADR-0042).
  # A tree hash covers submodule pointers and is the same under merge, squash
  # or rebase, so a merge whose pull request was green on that exact tree goes
  # straight to images and deploy.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      gates: ${{ steps.triage.outputs.gates }}
      verified: ${{ steps.triage.outputs.verified }}
      tree: ${{ steps.triage.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: triage
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # Fails closed: an unknown base or a failed lookup runs every gate.
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          # A pull request runs on its merge commit, so its change is HEAD^1..HEAD.
          if [ "$EVENT" = pull_request ]; then base="$(git rev-parse HEAD^1)"; else base="$BEFORE"; fi
          code=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]] && changed="$(git diff --name-only "$base" HEAD)"; then
            grep -qvE '^(docs/|[^/]+\.md$)' <<< "$changed" || code=false
          fi
          verified=false
          if [ "$EVENT" = push ]; then
            n="$(gh api "repos/$REPO/actions/artifacts?name=verified-tree-$tree" \
              --jq '[.artifacts[] | select(.expired | not)] | length')" || n=0
            if [ "${n:-0}" -gt 0 ]; then verified=true; fi
          fi
          gates=true
          if [ "$code" = false ] || [ "$verified" = true ]; then gates=false; fi
          echo "tree=$tree code=$code verified=$verified gates=$gates"
          { echo "tree=$tree"; echo "verified=$verified"; echo "gates=$gates"; } >> "$GITHUB_OUTPUT"

  # Lint, the import boundaries and the switches JSON: no database.
  backend:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/local.txt
      - run: ruff check . && ruff format --check .
      - run: lint-imports
      - name: Switches JSON is fresh (no DB needed)
        run: python manage.py dump_features ../docs-site/src/data/features.json --check --skip-checks
        # Settings require a URL; nothing connects to it.
        env: { DJANGO_SETTINGS_MODULE: config.settings.test, DATABASE_URL: "postgres://unused@localhost/unused" }

  # The suite (45 min serial) as four shards of whole files, balanced by test
  # count (scripts/pytest-shard.py), each on every core with pytest-xdist: one
  # test database per worker. backend-coverage holds the 80% floor over all four.
  backend-tests:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: backend tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DATABASE_URL: postgres://etqan:etqan@localhost:5432/etqan_test
    defaults: { run: { working-directory: backend } }
    steps:
      # Not a service container: those cannot take server flags. Every xdist
      # worker clones academy schemas inside one transaction each, and at the
      # default 64 locks per transaction concurrent clones run Postgres out of
      # shared memory.
      - name: Postgres, with room for concurrent schema clones
        working-directory: .
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_DB=etqan_test -e POSTGRES_USER=etqan -e POSTGRES_PASSWORD=etqan \
            postgres:18.6-alpine -c max_locks_per_transaction=512
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/local.txt
      # Over TCP: during initdb the image runs a socket-only server first.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U etqan >/dev/null 2>&1 && break; sleep 1; done
          docker exec pg pg_isready -h 127.0.0.1 -U etqan
      - name: This shard's test files
        run: |
          pytest --collect-only -q > "$RUNNER_TEMP/collected.txt"
          python3 ../scripts/pytest-shard.py ${{ matrix.shard }} 4 < "$RUNNER_TEMP/collected.txt" > "$RUNNER_TEMP/shard.txt"
          echo "$(wc -l < "$RUNNER_TEMP/shard.txt") files"
      # A test still running after 5 min prints every thread's stack, so a
      # hang shows where it is stuck (pytest's built-in faulthandler).
      - name: Tests
        run: |
          # shellcheck disable=SC2046 # one test file per word
          pytest --create-db -n auto --cov=etqan --cov-report= --cov-fail-under=0 -q \
            -o faulthandler_timeout=300 $(cat "$RUNNER_TEMP/shard.txt")
          mv .coverage ".coverage.shard${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: backend/.coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  backend-coverage:
    needs: [backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      # The same requirements, so the same coverage.py that wrote the data.
      - run: pip install -r requirements/local.txt
      - uses: actions/download-artifact@v8
        with: { pattern: backend-coverage-*, merge-multiple: true, path: backend }
      - name: Combined coverage meets the floor (pyproject fail_under)
        run: coverage combine && coverage report --skip-covered

  # Types, lint and the build; the unit tests are dashboard-tests.
  dashboard:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      - name: Fetch tokens submodule tags
        working-directory: .
        run: git -C tokens fetch --depth=1 --force origin "+refs/tags/*:refs/tags/*"
      - name: Token pin agrees with the submodule (G3)
        working-directory: .
        run: node scripts/check-token-pin.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

  # The unit suite (14 min serial) in three shards. Each writes a blob with
  # its coverage and no thresholds (a shard covers a third of the code);
  # dashboard-coverage merges them and holds the vitest.config.ts thresholds.
  dashboard-tests:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: dashboard tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/3 --reporter=blob --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-blob-${{ matrix.shard }}
          path: dashboard/.vitest-reports
          include-hidden-files: true
          retention-days: 1

  dashboard-coverage:
    needs: [dashboard-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with: { pattern: dashboard-blob-*, merge-multiple: true, path: dashboard/.vitest-reports }
      - name: Merged coverage meets the thresholds
        run: pnpm exec vitest run --merge-reports --coverage

  marketing:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: marketing } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: marketing/pnpm-lock.yaml }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      - name: Fetch tokens submodule tags
        working-directory: .
        run: git -C tokens fetch --depth=1 --force origin "+refs/tags/*:refs/tags/*"
      - name: Token pin agrees with the submodule (G3)
        working-directory: .
        run: node scripts/check-token-pin.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  # The official Etqan Tutor site (base domain). Standalone: no @etqan/tokens.
  website:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: website/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # The internal docs site (docs.{$BASE_DOMAIN}); reads docs/ in place, so a
  # docs-only change still runs it.
  docs-site:
    needs: [triage]
    if: needs.triage.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: docs-site } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: docs-site/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  caddy:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - name: Validate the local and e2e Caddyfiles
        run: |
          for f in caddy/Caddyfile.local caddy/Caddyfile.e2e; do
            docker run --rm -v "$PWD/$f:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile || exit 1
          done
      # The production image bakes in infra/caddy/Caddyfile and the cloudflare DNS
      # module. The token only has to be well-formed (40 chars) to provision.
      # TLS_MODE unset is production (cloudflare); internal is staging's; http
      # issues on demand without a DNS API.
      - name: Validate the production Caddyfile (infra) in every TLS mode
        run: |
          docker build -t etqan-edge infra/caddy
          # docs.{$BASE_DOMAIN} imports the host's users file: a fixture here.
          users="$(mktemp -d)"
          printf 'ci %s\n' "$(docker run --rm etqan-edge caddy hash-password --plaintext ci-pass)" > "$users/users.caddy"
          chmod 755 "$users"
          chmod 644 "$users/users.caddy"
          edge() {
            docker run --rm -e BASE_DOMAIN=example.com -e ACME_EMAIL=ci@example.com \
              -e CF_API_TOKEN=0000000000000000000000000000000000000000 \
              -v "$users:/etc/caddy/docs-users:ro" "$@"
          }
          validate=(caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile)
          adapt=(caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile)
          edge etqan-edge "${validate[@]}"
          edge -e TLS_MODE=internal etqan-edge "${validate[@]}"
          edge -e TLS_MODE=internal etqan-edge "${adapt[@]}" | grep -q '"module":"internal"'
          edge -e TLS_MODE=http etqan-edge "${validate[@]}"
          edge -e TLS_MODE=http etqan-edge "${adapt[@]}" | grep -q '"on_demand":true'
          # Unset means cloudflare: the same config, byte for byte.
          diff <(edge etqan-edge "${adapt[@]}") <(edge -e TLS_MODE=cloudflare etqan-edge "${adapt[@]}")
          # Any other value names no snippet, and the edge refuses to start.
          if edge -e TLS_MODE=internl etqan-edge "${validate[@]}"; then
            echo "TLS_MODE=internl was accepted"; exit 1
          fi
      # docs.{$BASE_DOMAIN}: 401 on every path without credentials, 200 with,
      # and the academy wildcard still answers (TLS_MODE=internal).
      - name: The docs site behind basic_auth, at the real edge
        run: |
          docker build -f docs-site/Dockerfile -t docs-site .
          bash infra/scripts/tests/docs_edge_test.sh

  orchestra:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: orchestra/web/pnpm-lock.yaml }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      - name: Server tests
        working-directory: orchestra/server
        run: python3 -m unittest discover -s tests -t . -v
      - name: Web tests, types, lint and build
        working-directory: orchestra/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage
          pnpm build
          pnpm lint

  infra-scripts:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - name: shellcheck the deploy, smoke, simulation and helper scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            infra/scripts/*.sh infra/scripts/tests/*.sh infra/scripts/tests/fakebin/* \
            infra/staging-sim/entrypoint.sh scripts/deploy.sh scripts/staging-sim.sh \
            scripts/staging-sim-needed.sh scripts/orchestration/*.sh scripts/orchestration/tests/*.sh \
            scripts/bump-submodules.sh scripts/check-submodule-pins.sh scripts/tests/*.sh
      - name: ship.sh, smoke.sh and compose tests
        run: |
          bash infra/scripts/tests/ship_test.sh
          bash infra/scripts/tests/smoke_test.sh
          bash infra/scripts/tests/compose_test.sh
          bash infra/scripts/tests/edge_ca_test.sh
      - name: just bump and the submodule pin check
        run: bash scripts/tests/submodules_test.sh
      - name: The backend test sharding
        run: bash scripts/tests/pytest_shard_test.sh
      # launch_phase_test drives the justfile's stream-down and _stack-manage.
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - name: orchestration scripts
        run: |
          bash scripts/orchestration/tests/stream_env_test.sh
          bash scripts/orchestration/tests/launch_phase_test.sh
          bash scripts/orchestration/tests/start_session_test.sh
          python3 -m unittest discover -s scripts/orchestration/tests -v

  # Three shards, each a whole stack with its own seeded database: the specs
  # stay serial within a shard (playwright.config.ts: one worker in CI), so
  # no two log in as the same account against one database at once.
  e2e:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: e2e (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_DB: etqan, POSTGRES_USER: etqan, POSTGRES_PASSWORD: etqan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etqan" --health-interval 5s --health-timeout 3s --health-retries 10
      # The cache is Redis in local settings; allauth's login rate limiting uses it.
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://etqan:etqan@localhost:5432/etqan
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only
      # Invites are real emails the e2e suite reads back: send them inline (no
      # worker) into files that e2e/mail.ts parses via E2E_MAIL_DIR.
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      DJANGO_EMAIL_FILE_PATH: /tmp/etqan-mail
      CELERY_TASK_ALWAYS_EAGER: "true"
      DJANGO_TENANT_URL_TEMPLATE: http://{domain}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: "dashboard/pnpm-lock.yaml\nmarketing/pnpm-lock.yaml" }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      # The browser download; --with-deps still installs the system packages.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
      - name: Backend up with seeded academies
        working-directory: backend
        run: |
          pip install -r requirements/local.txt
          python manage.py migrate_schemas --shared
          mkdir -p /tmp/etqan-mail
          python manage.py seed_dev
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf -H "Host: etqan.localhost" http://127.0.0.1:8000/health/live/ && break; sleep 1; done
          curl -sf -H "Host: etqan.localhost" http://127.0.0.1:8000/health/live/ >/dev/null || { echo "backend did not start"; cat /tmp/django.log; exit 1; }
      - name: Dashboard preview (base /app/)
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/app/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/app/ >/dev/null || { echo "dashboard preview did not start"; cat /tmp/preview.log; exit 1; }
      - name: Marketing site
        working-directory: marketing
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          SITE_API_ORIGIN=http://127.0.0.1:8000 SITE_SCHEME=http HOST=127.0.0.1 PORT=4321 \
            nohup node dist/server/entry.mjs > /tmp/marketing.log 2>&1 &
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:4321/ || { echo "marketing did not start"; cat /tmp/marketing.log; exit 1; }
      - name: Caddy edge on :80
        run: |
          docker run -d --name edge --network host \
            -v "$PWD/caddy/Caddyfile.e2e:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine
          for _ in $(seq 1 30); do curl -sf http://demo.etqan.localhost/api/v1/site/branding/ >/dev/null && break; sleep 1; done
          curl -sf http://demo.etqan.localhost/api/v1/site/branding/ >/dev/null || { echo "edge did not come up"; docker logs edge; exit 1; }
      - name: Playwright
        working-directory: dashboard
        env:
          E2E_DEMO_URL: http://demo.etqan.localhost
          E2E_OTHER_URL: http://other.etqan.localhost
          E2E_MAIL_DIR: /tmp/etqan-mail
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e --shard=${{ matrix.shard }}/3
      - if: failure()
        run: |
          tail -n 200 /tmp/django.log /tmp/preview.log /tmp/marketing.log
          docker logs edge 2>&1 | tail -n 100

  security:
    needs: [triage]
    if: needs.triage.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      # Pinned image: an unpinned scanner changes what "green" means without a
      # commit. Known historical findings are allowlisted by fingerprint in
      # .gitleaksignore, so a NEW secret in a NEW commit still fails here.
      - name: Gitleaks — meta repo history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
      # Directory mode covers the submodule working trees, which the history
      # scan above cannot see (submodule histories are a known gap).
      - name: Gitleaks — checked-out tree, submodules included
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner --exit-code 1

  # The images are built from the submodule pointers, so each must be a commit
  # on its repo's main (never an unmerged branch). Behind main only warns.
  submodules:
    needs: [triage]
    if: needs.triage.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - run: bash scripts/check-submodule-pins.sh

  # Spec §3.1: every image, built after the tests pass. Pull requests build
  # only (a broken Dockerfile fails the PR); master pushes <meta-sha> and
  # :master to GHCR (private). The backend image needs no build arguments
  # (its default target is production); the frontends read the private
  # @etqan/tokens repo through the tokens_token build secret. Runs when every
  # gate passed or was skipped by triage (a verified tree still needs its
  # images pushed under its own SHA).
  images:
    needs:
      - triage
      - backend
      - backend-tests
      - backend-coverage
      - dashboard
      - dashboard-tests
      - dashboard-coverage
      - marketing
      - website
      - docs-site
      - caddy
      - e2e
      - infra-scripts
      - orchestra
      - security
      - submodules
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, dashboard, marketing, website]
        include:
          # Built from the meta repo root: it reads docs/ in place.
          - name: docs-site
            context: .
            file: docs-site/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || matrix.name }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.name) }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/etqan-agency/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/etqan-agency/${{ matrix.name }}:master
          # Links the package to this repository, so this workflow may push it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          secrets: tokens_token=${{ secrets.TOKENS_REPO_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Spec §5: which pull requests need the staging simulation.
  sim-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        # Fails closed: a gate script that errors, or prints anything but
        # true or false, runs the simulation.
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            if out="$(bash scripts/staging-sim-needed.sh "$BASE")"; then
              case "$out" in
                true | false) run="$out" ;;
                *) echo "::warning::gate script printed '$out'; running the simulation" ;;
              esac
            else
              echo "::warning::gate script failed; running the simulation"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Spec §5: the staging deploy against a simulated server (sshd and
  # Docker-in-Docker, privileged, started with docker run: a service
  # container cannot be built from this repo). Two blue/green deploys under
  # a health poll, the smoke check, seed_staging and the full journey. One
  # retry of the whole run, never of a step. It runs alongside the tests
  # rather than after them: it builds its own images (from the layer cache
  # the images job keeps), and the deploys still wait for both.
  staging-sim:
    needs: [triage, sim-needed]
    if: needs.triage.outputs.gates == 'true' && needs.sim-needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIM_SHA: ${{ github.sha }}
      SIM_DIR: ${{ github.workspace }}/../staging-sim
    steps:
      # The server pulls about 3 GB, and ship.sh refuses to start with less
      # than 5 GB free: drop toolchains this job never uses. In the
      # background (a minute of deleting); the deploy step waits for it.
      - name: Free disk space
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            > /dev/null 2>&1 &
      - uses: actions/checkout@v7
        with: { submodules: recursive, token: "${{ secrets.SUBMODULE_TOKEN }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - uses: ./.github/actions/tokens-auth
        with: { token: "${{ secrets.TOKENS_REPO_TOKEN }}" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
      - name: Playwright (the journey runs from here)
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Simulated server and registry up
        run: bash scripts/staging-sim.sh up
      - uses: docker/setup-buildx-action@v4
      # The images job's layer cache makes these rebuilds cheap; they load
      # into the runner's docker, tagged for the local registry.
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: localhost:15000/etqan-agency/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          load: true
          tags: localhost:15000/etqan-agency/dashboard:${{ github.sha }}
          secrets: tokens_token=${{ secrets.TOKENS_REPO_TOKEN }}
          cache-from: type=gha,scope=dashboard
      - uses: docker/build-push-action@v7
        with:
          context: marketing
          load: true
          tags: localhost:15000/etqan-agency/marketing:${{ github.sha }}
          secrets: tokens_token=${{ secrets.TOKENS_REPO_TOKEN }}
          cache-from: type=gha,scope=marketing
      - uses: docker/build-push-action@v7
        with:
          context: website
          load: true
          tags: localhost:15000/etqan-agency/website:${{ github.sha }}
          cache-from: type=gha,scope=website
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docs-site/Dockerfile
          load: true
          tags: localhost:15000/etqan-agency/docs-site:${{ github.sha }}
          cache-from: type=gha,scope=docs-site
      - name: Disk space freed
        run: |
          while pgrep -f 'rm -rf /usr/share/dotnet' > /dev/null; do sleep 2; done
          df -h /
      - name: Deploy twice, seed, smoke and walk the journey
        run: |
          bash scripts/staging-sim.sh run && exit 0
          echo "::warning::The staging simulation failed; retrying the whole run once."
          bash scripts/staging-sim.sh down
          bash scripts/staging-sim.sh up
          bash scripts/staging-sim.sh run
      - if: failure()
        name: Server logs
        run: |
          docker exec etqan-sim-server sh -c 'cd /opt/etqan && docker compose -f docker-compose.production.yml \
            -f docker-compose.staging.yml --env-file .env.production logs --no-color --tail 150' || true
      - if: always()
        run: bash scripts/staging-sim.sh down

  # A pull request whose every gate passed records its tree; the push that
  # merges it finds the record in triage and skips the gates (see triage).
  record-verified-tree:
    needs:
      - triage
      - backend
      - backend-tests
      - backend-coverage
      - dashboard
      - dashboard-tests
      - dashboard-coverage
      - marketing
      - website
      - docs-site
      - caddy
      - e2e
      - infra-scripts
      - orchestra
      - security
      - submodules
      - images
      - staging-sim
    if: ${{ github.event_name == 'pull_request' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "${{ needs.triage.outputs.tree }}" > tree.txt
      - uses: actions/upload-artifact@v7
        with:
          name: verified-tree-${{ needs.triage.outputs.tree }}
          path: tree.txt
          retention-days: 14

  # Spec §3.2: every green master is deployed, to staging and then to
  # production, once each server exists; an environment without its SSH_HOST
  # secret skips its steps and succeeds. Production waits for staging, so a
  # deploy that breaks staging never reaches it. Manual runs (rollback) use the
  # same workflow. staging-sim is skipped on a verified tree (its pull request
  # ran it, or did not need it), so it may be skipped here but never failed.
  deploy-staging:
    needs: [images, staging-sim]
    if: >-
      ${{ !failure() && !cancelled() && needs.images.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
    secrets: inherit

  # A bare `if:` means success(), which is false whenever any job upstream
  # was skipped, as every gate is on a verified tree; so say it explicitly.
  deploy-production:
    needs: [deploy-staging]
    if: >-
      ${{ !failure() && !cancelled() && needs.deploy-staging.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      sha: ${{ github.sha }}
    secrets: inherit

name: Deploy

# Spec §3.2. Called by CI for every green master push (staging, then
# production), and run by hand to roll back (or forward) to any master commit
# whose images are in GHCR. Each GitHub environment holds its own secrets
# under the same names: SSH_HOST, SSH_USER, SSH_KEY, KNOWN_HOSTS,
# GHCR_READ_TOKEN, ACADEMY_URL. Without SSH_HOST every step after the first is
# skipped and the job succeeds: master stays green before a server exists.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true
      seed:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      sha:
        description: Meta commit SHA (40 characters) whose images to deploy
        type: string
        required: true
      seed:
        description: Run seed_staging (creates the demo academy if it is missing; staging only)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment, and a running one is never cancelled.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # Job-level `if:` cannot read secrets; this step can, and every other
      # step is conditional on its answer.
      - name: Is this environment configured?
        id: gate
        env:
          HOST: ${{ secrets.SSH_HOST }}
          TARGET: ${{ inputs.environment }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice title=${TARGET} not configured::No SSH_HOST secret in the ${TARGET} environment, so nothing was deployed. See docs/guide/runbooks/deploy.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # Never trust inputs.sha before it is proven to be a real, merged
      # commit: a manual dispatch could otherwise deploy an unmerged commit
      # or a branch name with every secret of the environment in scope.
      - name: Validate the inputs (SHA format; seed only on staging)
        if: steps.gate.outputs.configured == 'true'
        env:
          SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.environment }}
          SEED: ${{ inputs.seed }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a 40-character lowercase hex commit SHA"
            exit 1
          fi
          if [ "$SEED" = true ] && [ "$TARGET" != staging ]; then
            echo "::error::seed creates demo data; it runs on staging only"
            exit 1
          fi
      - if: steps.gate.outputs.configured == 'true'
        name: Checkout master (to verify the SHA against it)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false
      - name: Validate the SHA (on master)
        if: steps.gate.outputs.configured == 'true'
        env:
          SHA: ${{ inputs.sha }}
        # fetch-depth: 0 already fetched every branch into origin/*; no
        # credentials are left to fetch again with.
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not an ancestor of origin/master"
            exit 1
          fi
      - if: steps.gate.outputs.configured == 'true'
        name: Checkout the deployed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          # The token still checks the submodules out; it is not left in
          # .git/config for the steps that hold the environment's secrets.
          persist-credentials: false
      - name: SSH key and known hosts, as files
        if: steps.gate.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set +x
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"
      - name: Deploy, then smoke-check
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          DEPLOY_SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/deploy_known_hosts
          DEPLOY_ACADEMY_URL: ${{ secrets.ACADEMY_URL }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
          SEED: ${{ inputs.seed && '1' || '0' }}
        run: bash scripts/deploy.sh "$DEPLOY_SHA"
      - name: Remove the key
        if: always() && steps.gate.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"

# Local stack behind Caddy (caddy/Caddyfile.local). Every academy is
# http://<subdomain>.etqan.localhost: the marketing site at /, the dashboard at
# /app/, the API at /api/ — all same-origin. http://etqan.localhost/admin/ is
# the Etqan staff console.
x-uidgid: &uidgid
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_READ_DOT_ENV_FILE: "True"
  DATABASE_URL: postgres://etqan:etqan@postgres:5432/etqan
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_TENANT_BASE_DOMAIN: etqan.localhost
  DJANGO_TENANT_URL_TEMPLATE: http://{domain}

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [django, dashboard, marketing]

  django:
    build: { context: ./backend, target: dev, args: *uidgid }
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [./backend:/app]
    ports: ["${ETQAN_API_PORT:-8000}:8000"]
    env_file: [./backend/.env]
    environment: *django-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:18-alpine
    volumes: [postgres_data:/var/lib/postgresql]
    environment: { POSTGRES_DB: etqan, POSTGRES_USER: etqan, POSTGRES_PASSWORD: etqan }
    ports: ["${ETQAN_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etqan"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports: ["${ETQAN_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: { context: ./backend, target: dev, args: *uidgid }
    command: celery -A config.celery_app worker -l info
    volumes: [./backend:/app]
    env_file: [./backend/.env]
    environment: *django-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery_beat:
    build: { context: ./backend, target: dev, args: *uidgid }
    command: celery -A config.celery_app beat -l info
    volumes: [./backend:/app]
    env_file: [./backend/.env]
    environment: *django-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  flower:
    build: { context: ./backend, target: dev, args: *uidgid }
    command: celery -A config.celery_app flower --port=5555
    volumes: [./backend:/app]
    ports: ["${ETQAN_FLOWER_PORT:-5555}:5555"]
    env_file: [./backend/.env]
    environment: *django-env
    depends_on:
      redis: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["${ETQAN_MAIL_UI_PORT:-8025}:8025", "${ETQAN_SMTP_PORT:-1025}:1025"]

  dashboard:
    build:
      context: ./dashboard
      target: dev
      args: *uidgid
      secrets: [tokens_token]
    environment:
      - VITE_PROXY_TARGET=http://django:8000
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules

  marketing:
    build:
      context: ./marketing
      target: dev
      args: *uidgid
      secrets: [tokens_token]
    environment:
      - SITE_API_ORIGIN=http://django:8000
      - SITE_SCHEME=http
    volumes:
      - ./marketing:/app
      - marketing_node_modules:/app/node_modules

volumes:
  postgres_data:
  dashboard_node_modules:
  marketing_node_modules:

secrets:
  tokens_token:
    environment: GH_TOKEN

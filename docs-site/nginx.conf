# Static Starlight build: /switches/ is /switches/index.html, and
# every unknown path gets the site's own 404 page. Caddy does the auth.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Astro fingerprints everything under /_astro/: cache it for good.
    location /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
